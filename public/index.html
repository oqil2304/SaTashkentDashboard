<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaTashkent – Boshqaruv Paneli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
  <link rel="icon" href="/logo.png?v=25" type="image/png" />
  <link rel="apple-touch-icon" href="/logo.png?v=25" />
  <link rel="stylesheet" href="/style.css?v=25" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-circle" style="overflow:hidden;padding:0;">
          <img src="/logo.png?v=25" alt="SaTashkent Supply" style="width:100%;height:100%;object-fit:cover;display:block;" />
        </div>
        <div>
          <div class="sidebar-brand">SaTashkent</div>
          <div class="sidebar-brand-sub">Ta'minot Bo'limi</div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item active" data-section="overview" href="#">
        <i class="ti ti-layout-dashboard nav-icon"></i>
        <span>Umumiy ko'rinish</span>
      </a>
      <a class="nav-item" data-section="products" href="#">
        <i class="ti ti-building-warehouse nav-icon"></i>
        <span>Ombor</span>
      </a>
      <a class="nav-item" data-section="purchases" href="#">
        <i class="ti ti-shopping-cart nav-icon"></i>
        <span>Sotib olishlar</span>
      </a>
      <a class="nav-item" data-section="consumptions" href="#">
        <i class="ti ti-package-export nav-icon"></i>
        <span>Rasxodlar</span>
      </a>
      <a class="nav-item" data-section="branches" href="#">
        <i class="ti ti-building-store nav-icon"></i>
        <span>Filiallar</span>
      </a>
      <a class="nav-item" data-section="suppliers" href="#">
        <i class="ti ti-truck nav-icon"></i>
        <span>Ta'minotchilar</span>
      </a>
      <a class="nav-item" data-section="report" href="#">
        <i class="ti ti-chart-bar nav-icon"></i>
        <span>Hisobot</span>
      </a>
      <a class="nav-item admin-only" data-section="users" href="#" style="display:none">
        <i class="ti ti-users nav-icon"></i>
        <span>Foydalanuvchilar</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebar-user-btn" title="Shaxsiy kabinet" style="cursor:pointer;flex:1" onclick="navigate('profile')">
        <div class="sidebar-avatar" id="user-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-username" id="sidebar-username">Admin</div>
          <div class="sidebar-role" id="sidebar-role">Administrator</div>
        </div>
      </div>
      <button class="btn-logout" id="logout-btn" title="Chiqish">
        <i class="ti ti-logout"></i>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-wrap">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebar-toggle">
        <i class="ti ti-menu-2"></i>
      </button>
      <h1 class="page-title" id="page-title">Umumiy ko'rinish</h1>
      <div class="topbar-actions">
        <div class="lang-switch" id="lang-switch">
          <button data-lang="uz">UZ</button>
          <button data-lang="ru">RU</button>
          <button data-lang="en">EN</button>
        </div>
        <button class="alert-btn" id="alert-btn" title="Ogohlantirishlar">
          <i class="ti ti-bell"></i>
          <span class="alert-badge" id="alert-count" style="display:none">0</span>
        </button>
      </div>
    </header>

    <main class="content" id="content">
      <div class="loading-state">
        <i class="ti ti-loader-2 spin"></i>
        <span>Yuklanmoqda...</span>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal-box" id="modal-box"></div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Modullar -->
  <script src="/js/state.js?v=25"></script>
  <script src="/js/i18n.js?v=25"></script>
  <script src="/js/icons.js?v=25"></script>
  <script src="/js/api.js?v=25"></script>
  <script src="/js/helpers.js?v=25"></script>
  <script src="/js/ui.js?v=25"></script>
  <script src="/js/tablesort.js?v=25"></script>
  <script src="/js/overview.js?v=25"></script>
  <script src="/js/products.js?v=25"></script>
  <script src="/js/purchases.js?v=25"></script>
  <script src="/js/consumptions.js?v=25"></script>
  <script src="/js/branches.js?v=25"></script>
  <script src="/js/suppliers.js?v=25"></script>
  <script src="/js/report.js?v=25"></script>
  <script src="/js/users.js?v=25"></script>
  <script src="/js/profile.js?v=25"></script>
  <script src="/js/main.js?v=25"></script>
  <!-- SheetJS — Excel export uchun -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</body>
</html>
